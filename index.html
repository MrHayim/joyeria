<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aranza Hernández Joyería</title>
<meta name="theme-color" content="#231e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Joyería AH">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f6f2eb;--surface:#fffdf9;--surface2:#f0e9dd;--ink:#2a2420;--ink2:#6e6359;--ink3:#9a8f84;
  --line:#e3dacb;--gold:#a87a24;--gold-ink:#7d5a17;--goldbg:#f5ead2;--dark:#231e1a;--dark2:#342c26;
  --ok:#4c7a47;--okbg:#e6efe2;--warn:#a85c18;--warnbg:#fbeedd;--bad:#a2392e;--badbg:#f7e3df;
  --r:14px;--shadow:0 1px 2px rgba(42,36,32,.05),0 6px 20px rgba(42,36,32,.06);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:30px}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.mut{color:var(--ink2)}.small{font-size:13px}.xs{font-size:12px}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* Layout */
#app{display:flex;min-height:100vh}
#side{width:236px;flex:none;background:var(--dark);color:#e7dcc6;padding:22px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:23px;line-height:1.05;color:#f4e2b8;padding:0 12px 20px}
.brand small{display:block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#a8997f;margin-top:6px;font-weight:500}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;color:inherit;cursor:pointer;text-align:left;width:100%;font-weight:500}
.nav:hover{background:#2e2721}
.nav.on{background:var(--dark2);color:#fff}
.nav.on svg{color:var(--gold2,#d9b56a)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#c99a3e;color:#231e1a;font-size:11px;font-weight:700}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;padding:4px}
.sesion{display:flex;align-items:center;gap:10px;width:100%;background:#2e2721;border:1px solid #40362e;border-radius:12px;padding:10px;color:#f4e9d2;cursor:pointer;text-align:left}
.sesion:hover{background:#3a312a}
.sesion .who{min-width:0;flex:1}
.sesion .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sesion .e{font-size:11.5px;color:#b9ab93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sesion .c{font-size:11px;color:#d9b56a;font-weight:600}
.avatar{width:34px;height:34px;border-radius:50%;background:#c99a3e;color:#231e1a;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:15px}
.avatar.lg{width:56px;height:56px;font-size:24px}
.uchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;max-width:300px;flex:none;text-align:left}
.uchip{order:2}#prices{order:1}
.uchip .who{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.uchip small{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip .avatar{width:28px;height:28px;font-size:13px}
.uchip span{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:rgba(246,242,235,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px;min-height:58px}
.mbrand{display:none;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:19px;line-height:1;white-space:nowrap}
#prices{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 0}
#prices::-webkit-scrollbar{display:none}
.pchip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pchip b{color:var(--gold-ink);font-weight:600}
.pchip.warn{background:var(--warnbg);border-color:#efd3b1;color:var(--warn)}
main{padding:24px;max-width:1240px;width:100%;margin:0 auto 40px}
#bottom{display:none}
.red{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 24px;font-size:13.5px;border-bottom:1px solid var(--line)}
.red.off{background:var(--warnbg);color:var(--warn)}
.red.sync{background:var(--goldbg);color:var(--gold-ink);justify-content:flex-start}
.red.sync .btn{margin-left:auto}
.red.bad{background:var(--badbg);color:var(--bad)}
@media (max-width:899px){.red{padding:8px 12px}}
.acceso{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:420px;padding:20px 16px}
.acceso .brand{text-align:center;padding:0}
.quien{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.persona{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;font-weight:600}
.persona:hover{border-color:var(--gold)}
.persona small{font-size:11px;color:var(--ok);font-weight:500}
.pinbox{display:block;width:100%;max-width:260px;margin:0 auto;text-align:center;font-size:26px!important;letter-spacing:.45em;padding-left:.45em!important;min-height:56px!important;font-variant-numeric:tabular-nums}
#loading{overflow-y:auto}
.demo-banner{background:var(--goldbg);color:var(--gold-ink);font-size:13px;padding:8px 24px;border-bottom:1px solid #ead9b3}
@media (max-width:899px){
  #side{display:none}
  #top{padding:8px 12px;min-height:52px}
  .mbrand{display:none}
  .uchip{max-width:130px;order:0}.uchip small{display:none}
  main{padding:14px 12px;margin-bottom:110px}
  h1{font-size:26px}
  .red{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 24px;font-size:13.5px;border-bottom:1px solid var(--line)}
.red.off{background:var(--warnbg);color:var(--warn)}
.red.sync{background:var(--goldbg);color:var(--gold-ink);justify-content:flex-start}
.red.sync .btn{margin-left:auto}
.red.bad{background:var(--badbg);color:var(--bad)}
@media (max-width:899px){.red{padding:8px 12px}}
.acceso{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:420px;padding:20px 16px}
.acceso .brand{text-align:center;padding:0}
.quien{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.persona{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;font-weight:600}
.persona:hover{border-color:var(--gold)}
.persona small{font-size:11px;color:var(--ok);font-weight:500}
.pinbox{display:block;width:100%;max-width:260px;margin:0 auto;text-align:center;font-size:26px!important;letter-spacing:.45em;padding-left:.45em!important;min-height:56px!important;font-variant-numeric:tabular-nums}
#loading{overflow-y:auto}
.demo-banner{padding:8px 12px}
  #bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--dark);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
  #bottom button{flex:1;background:none;border:0;color:#bfb29c;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:4px 0;position:relative;cursor:pointer}
  #bottom button.on{color:#f4e2b8}
  #bottom .badge{position:absolute;top:0;right:calc(50% - 22px);min-width:16px;height:16px;font-size:10px;padding:0 4px}
}
@media (min-width:900px){ .only-m{display:none!important} }

/* Components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:500;cursor:pointer;white-space:nowrap;min-height:40px;text-decoration:none}
.btn:hover{border-color:#cfc3ae}
.btn:disabled{opacity:.55;cursor:default}
.btn.pri{background:var(--dark);border-color:var(--dark);color:#f8eed8}
.btn.pri:hover{background:#3a312a}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--bad);border-color:#ebc9c3}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn svg.i{width:18px;height:18px}
.icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--ink2);cursor:pointer;flex:none}
.icon:hover{background:var(--surface2);color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph p{margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:16px}
.panel h2{margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:899px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g2.st{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--ink2)}
.kpi .v{font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink2)}
input[type=text],input[type=password],input[type=number],input[type=tel],input[type=date],input[type=month],input[type=search],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;min-height:40px;color:var(--ink);font-size:15px;outline:none}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(168,122,36,.15)}
input:disabled{background:var(--surface2);color:var(--ink3)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.sm button{padding:4px 10px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.gold{background:var(--goldbg);color:var(--gold-ink)}
.ubic{display:inline-flex;align-items:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;background:var(--dark);color:#f4e2b8;border-radius:6px;padding:2px 7px;white-space:nowrap}
.ubic.otra{background:var(--surface2);color:var(--ink);font-family:Inter,sans-serif}
.note-low{font-size:12px;color:var(--warn);font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}
.empty svg.i{width:34px;height:34px;color:var(--ink3);margin-bottom:6px}
.sep{height:1px;background:var(--line);margin:14px 0}
.link{color:var(--gold-ink);font-weight:500;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}

/* Tables / lists */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid #efe8dc;vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fbf7f0}
.tbl .r{text-align:right}
.tscroll{overflow-x:auto;margin:0 -4px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #efe8dc;cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:#fbf7f0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--ink2)}
.li .rt{text-align:right;flex:none}

/* Inventory */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:16px}
@media (max-width:899px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lote{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;transition:border-color .15s}
.lote:hover{border-color:#cdbfa8}
.lote.agotado{opacity:.6}
.thumb{width:76px;height:76px;border-radius:10px;background:var(--surface2);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink3)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.xs{width:40px;height:40px;border-radius:8px}
.thumb.xs svg.i{width:18px;height:18px}
.thumb.lg{width:100%;height:260px;border-radius:12px;cursor:zoom-in;position:relative}
.thumb.lg img{object-fit:contain;background:#fff}
.thumb.lg .cargando{position:absolute;right:10px;bottom:10px;color:var(--ink3)}
.fotobtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fotobtns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.fotobtns button.on{border-color:var(--gold);color:var(--gold-ink);font-weight:600}
#visor{position:fixed;inset:0;background:rgba(10,8,6,.94);z-index:300;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#visor.open{display:flex}
#visor img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:6px}
#visor .orig{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92)}
#visor .x{position:absolute;top:14px;right:14px;color:#fff;background:rgba(255,255,255,.12);border:0;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
.thumb.lg svg.i{width:44px;height:44px}
.lote .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lote .t{font-weight:600;line-height:1.25}
.lote .s{font-size:13px;color:var(--ink2)}
.stockbar{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:4px}
.stockbar i{display:block;height:100%;background:var(--gold)}

/* Autocomplete */
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(42,36,32,.16);z-index:40;max-height:360px;overflow-y:auto;display:none}
.ac-list.open{display:block}
.aci{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;border-bottom:1px solid #f2ece2}
.aci:last-child{border-bottom:0}
.aci.act,.aci:hover{background:var(--goldbg)}
.aci .t{font-weight:600;font-size:14px}
.aci .s{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.aci .plus{width:40px;height:40px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold-ink);flex:none}
.searchbig{position:relative}
.searchbig svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.searchbig input{padding-left:42px;min-height:50px;font-size:16px;border-radius:12px;border-width:1.5px}

/* Cotizar */
.cot-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.cot-res{position:sticky;top:76px}
@media (max-width:1000px){.cot-grid{grid-template-columns:1fr}.cot-res{position:static}}
.cli{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:14px}
@media (max-width:600px){.cli{grid-template-columns:1fr}}
.items{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.item-h{display:flex;gap:10px;align-items:flex-start}
.item-h .grow{flex:1;min-width:0}
.item-h .t{font-weight:600}
.item-h .s{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item-g{display:grid;grid-template-columns:124px 112px minmax(0,1fr) 84px minmax(120px,auto);gap:10px;align-items:end;margin-top:10px}
.item-g.dir .wide{grid-column:span 2}
.item-g .imp{text-align:right;padding-bottom:2px}
.item-g .imp .v{font-size:18px;font-weight:600}
.item-g .imp .pg{font-size:12px;color:var(--ink2)}
@media (max-width:760px){
  .item-h{flex-wrap:wrap}.item-h .seg{order:5;margin-left:50px}
  .item-g{grid-template-columns:1fr 1fr}.item-g.dir .wide{grid-column:1/-1}
  .item-g .imp{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;text-align:left;border-top:1px dashed var(--line);padding-top:8px}
}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;height:40px}
.stepper button{width:34px;height:100%;border:0;background:var(--surface2);cursor:pointer;font-size:18px;color:var(--ink)}
.stepper input{border:0;min-height:0;height:100%;text-align:center;padding:0;border-radius:0;box-shadow:none!important}
.est{font-size:11px;color:var(--ink3);font-weight:400}
.tot-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
.tot-row.big{font-size:22px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.desc-ctl{display:grid;grid-template-columns:70px 1fr;gap:6px;margin:6px 0}
.sticky-tot{display:none}
@media (max-width:1000px){

  guardarCotizacion(d) { const c = {...d.cot}; const nuevo = !c.id; if (nuevo) { c.id = pendId('COT'); c.fecha = nowISO(); c.usuario = S.usuario; } return {res: c, localId: nuevo ? c.id : null}; },

const idReal = (accion, r) => accion === 'vender' ? r && r.venta && r.venta.id : r && r.id;
let sincronizando = false;
async function sincronizar() {
  if (sincronizando || !Cola.items.length) { renderRed(); return; }
  sincronizando = true; renderRed();
  let subidas = 0;
  try {
    while (Cola.items.length) {
      const op = Cola.items[0];
      let txt = JSON.stringify(op.datos);
      Object.entries(Cola.mapa).forEach(([k, v]) => { txt = txt.split(k).join(v); });
      let r;
      try { r = await api(op.accion, JSON.parse(txt), op.token || Acceso.token()); }
      catch (e) {
        if (e.red) break;
        if (e.sesion) { op.token = Acceso.token(); if (!op.reintento) { op.reintento = true; Cola.guardar(); continue; } }
        Cola.conflictos.push({resumen: op.resumen, error: e.message, t: op.t});
        Cola.items.shift(); Cola.guardar(); continue;
      }
      if (op.localId && idReal(op.accion, r)) Cola.mapa[op.localId] = idReal(op.accion, r);
      Cola.items.shift(); Cola.guardar(); subidas++;
    }
  } finally { sincronizando = false; }
  if (!Cola.items.length) {
    // Cambia los folios provisionales por los definitivos en la cotización en curso
    if (S.cot) { let t = JSON.stringify(S.cot); Object.entries(Cola.mapa).forEach(([k, v]) => { t = t.split(k).join(v); }); S.cot = JSON.parse(t); guardarBorrador(); }
    Cola.mapa = {}; Cola.guardar();
    if (subidas) toast(`Se subieron ${subidas} ${subidas === 1 ? 'movimiento' : 'movimientos'} guardados sin conexión`);

  }

function buscarLotesTodos(q) {
  const toks = norm(q).split(/\s+/).filter(Boolean).map(k => /[lrnd]es$/.test(k) && k.length > 4 ? k.slice(0, -2) : (/s$/.test(k) && k.length > 3 ? k.slice(0, -1) : k));
  return S.lotes.filter(l => l.activo).filter(l => { const t = norm([l.tipo, l.estilo, l.material, l.medida, l.ubicacion, l.id, l.notas, l.proveedor].join(' ')); return toks.every(k => t.includes(k)); });
}

// Muestra la vista rápida de la foto (≈80 KB). Se guarda en el dispositivo: la segunda vez abre al instante.
async function traerFoto(fileId) {
  if (S.fotos[fileId]) return S.fotos[fileId];
  const guardada = await KV.get('foto:' + fileId);
  if (guardada) return (S.fotos[fileId] = guardada);
  const r = await api('foto', {fileId});
  S.fotos[fileId] = r.dataUrl;
  KV.set('foto:' + fileId, r.dataUrl);
  return r.dataUrl;
}
async function mostrarFoto(f) {
  const box = $('#lote-foto'); if (!box || !f) return;
  const id = f.m || f.o;
  box.dataset.f = id; box.dataset.o = f.o;
  if (S.fotos[id]) { box.innerHTML = `<img src="${S.fotos[id]}" alt="">`; return; }
  box.insertAdjacentHTML('beforeend', '<span class="spin cargando"></span>');
  try {
    const url = await traerFoto(id);
    const b = $('#lote-foto'); if (b && b.dataset.f === id) b.innerHTML = `<img src="${url}" alt="">`;
  } catch (e) { const sp = $('#lote-foto .cargando'); if (sp) sp.remove(); }
}

function cargarImagen(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('No se pudo leer la imagen')); img.src = fr.result; };
    fr.onerror = () => rej(new Error('No se pudo leer el archivo'));
    fr.readAsDataURL(file);
  });
}
// Miniatura para listas: pequeña (≈10 KB) y siempre por debajo del límite de una celda de la hoja
function miniatura(img) {
  let t = reducir(img, 240, .72);
  if (t.length > 30000) t = reducir(img, 200, .6);
  if (t.length > 30000) t = reducir(img, 160, .5);
  return t;
}
function reducir(img, max, q, tipo = 'image/jpeg', fondo = '#fff') {
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const x = c.getContext('2d'); if (tipo === 'image/jpeg') { x.fillStyle = fondo; x.fillRect(0, 0, c.width, c.height); }
  x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL(tipo, q);
}
async function guardarLote(btn) {
  const m = $('#modal'), f = S.form;
  const orig = f.loteId ? loteDe(f.loteId) : null;
  const tipo = leerSelOtro(m, 'tipo'), estilo = leerSelOtro(m, 'estilo'), material = leerSelOtro(m, 'material'), prov = leerSelOtro(m, 'proveedor');
  const cant = Math.floor(num($('#f-cant').value));
  if (!tipo.valor) return toast('Elige el tipo de pieza', 'err');
  if (!material.valor) return toast('Elige el material', 'err');
  if (cant <= 0) return toast('Pon la cantidad comprada', 'err');
  const u = leerUbic();
  if (u.modo === 'anaquel' && !u.caja && !window.confirm('Falta el número de caja.\n¿Guardar sin número de caja?')) return;
  const tc = $('#f-tc .on').dataset.k;
  const ctotal = $('#f-ctotal').value === '' ? null : num($('#f-ctotal').value);
  const cunit = $('#f-cunit').value === '' ? null : num($('#f-cunit').value);
  let costoTotal = null, costoUnit = null;
  if (tc !== 'desconocido') {
    if (ctotal != null) { costoTotal = ctotal; costoUnit = r2(ctotal / cant); }
    else if (cunit != null) { costoUnit = cunit; costoTotal = r2(cunit * cant); }
    else return toast('Pon el costo o marca "Desconocido"', 'err');
  }
  const disp = orig ? Math.max(0, Math.floor(num($('#f-disp').value))) : cant;
  const ubicNueva = u._nuevo ? u.otra : null; delete u._nuevo;
  const lote = {
    ...(orig ? {id: orig.id, activo: 'si'} : {}),
    fecha: $('#f-fecha').value || hoy(), proveedor: prov.valor, tipo: tipo.valor, estilo: estilo.valor, material: material.valor,
    medida: $('#f-medida').value.trim(), unidad: $('#f-unidad').value, pesoProm: num($('#f-peso').value),
    cantidad: cant, disponible: disp, costoTotal: costoTotal ?? '', costoUnit: costoUnit ?? '', tipoCosto: tc,
    ubicacion: codigoUbic(u), ubicJSON: JSON.stringify(u), fotos: JSON.stringify(orig ? orig.fotosArr : []), notas: $('#f-notas').value.trim()
  };
  const fotos = f.nuevasFotos.slice();
  await ocupado(btn, async () => {
    const raw = await enviar('guardarLote', {lote});
    const r = nLote(raw);
    upsert(S.lotes, r);
    // nuevas opciones de lista
    const L = cfg('listas'); let cambio = false;
    if (tipo.nuevo && !L.tipos.some(t => t.nombre === tipo.valor)) { L.tipos.push({nombre: tipo.valor, unidad: lote.unidad}); cambio = true; }
    [['estilos', estilo], ['materiales', material], ['proveedores', prov]].forEach(([k, o]) => { if (o.nuevo && !L[k].includes(o.valor)) { L[k].push(o.valor); cambio = true; } });
    if (ubicNueva && !L.otrasUbic.includes(ubicNueva)) { L.otrasUbic.push(ubicNueva); cambio = true; }
    if (cambio) await saveCfg('listas', L);
    if (raw._offline && fotos.length) { fotos.length = 0; toast('Sin conexión: la compra se guardó, pero las fotos no. Agrégalas cuando regrese la señal.', 'err'); }
    for (let i = 0; i < fotos.length; i++) {
      toast(`Subiendo foto ${i + 1} de ${fotos.length}…`);
      const x = await api('subirFoto', {loteId: r.id, dataUrl: fotos[i].full, media: fotos[i].media, thumb: fotos[i].thumb});
      upsert(S.lotes, nLote(x.lote)); if (x.thumb) { S.thumbs[r.id] = x.thumb; KV.set('thumbs', S.thumbs); }
    }
    cerrarModal();
    if (!raw._offline || !fotos.length) toast(raw._offline ? 'Sin conexión: guardado en este dispositivo, se subirá después' : (orig ? 'Cambios guardados' : `Compra registrada como ${r.id}`));
    render();
  });
}

function calcItem(it) {
  if (it.modo === 'directo') { it.precioGramo = null; it.importe = r2(num(it.precioDirecto) * num(it.cantidad)); }
  else { it.precioGramo = r2(num(it.precioMercado) * (1 + num(it.pct) / 100)); it.importe = r2(num(it.peso) * it.precioGramo); }
  return it;
}
function calcCot(c) {
  c.items.forEach(calcItem);
  c.subtotal = r2(c.items.reduce((s, i) => s + i.importe, 0));
  let d = c.descTipo === '%' ? c.subtotal * num(c.descValor) / 100 : num(c.descValor);
  c.descuento = r2(Math.max(0, Math.min(d, c.subtotal)));
  c.total = r2(c.subtotal - c.descuento);
  return c;
}

function prepararVenta() {
  const c = calcCot(S.cot);
  let costoTotal = 0, ganancia = 0, incompleto = false;
  const items = c.items.map(it => {
    const share = c.subtotal ? it.importe / c.subtotal : 0;
    const neto = r2(it.importe - c.descuento * share);
    const cu = it.costoUnit === '' || it.costoUnit === null || it.costoUnit === undefined ? null : num(it.costoUnit);
    const costo = cu === null ? null : r2(cu * num(it.cantidad));
    const gan = costo === null ? null : r2(neto - costo);
    if (costo === null) incompleto = true; else { costoTotal += costo; ganancia += gan; }
    return {...it, cantidad: num(it.cantidad), peso: num(it.peso), precioMercado: it.modo === 'peso' ? num(it.precioMercado) : null, pct: it.modo === 'peso' ? num(it.pct) : null,
      precioDirecto: it.modo === 'directo' ? num(it.precioDirecto) : null, importeNeto: neto, costoUnit: cu, costo, ganancia: gan};
  });
  return {cotizacionId: c.id || '', clienteId: c.clienteId, clienteNombre: c.clienteNombre.trim(), clienteTel: c.clienteTel.trim(), items,
    descTipo: c.descTipo, descValor: num(c.descValor), subtotal: c.subtotal, descuento: c.descuento, total: c.total,
    costoTotal: r2(costoTotal), ganancia: r2(ganancia), costoIncompleto: incompleto ? 'si' : 'no', notas: c.notas};
}

async function ticketCanvas() {
  // Se dibuja directo en un canvas: sale igual en Chrome, Firefox y Safari.
  const d = S.ticket.d, tipo = S.ticket.tipo, n = cfg('negocio'), cot = tipo === 'cotizacion';
  const SERIF = '"Cormorant Garamond", Georgia, serif', SANS = 'Inter, Arial, sans-serif';
  try { if (document.fonts) await Promise.all([document.fonts.load(`700 22px ${SERIF}`), document.fonts.load(`400 13px ${SANS}`), document.fonts.load(`600 13px ${SANS}`), document.fonts.load(`700 13px ${SANS}`)]); } catch (e) {}
  let logo = null;
  if (n.logo) logo = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = n.logo; });
  const W = 380, P = 20, K = 3, CW = W - 2 * P;
  const lineas = (ctx, txt, font, max) => {
    ctx.font = font; const out = []; let cur = '';
    String(txt).split(/\s+/).filter(Boolean).forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > max && cur) { out.push(cur); cur = w; } else cur = t; });
    if (cur) out.push(cur); return out.length ? out : [''];
  };

    let y = P;
    const texto = (t, font, color, align, x, yy) => { if (!pinta) return; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top'; ctx.fillText(t, x, yy); };
    const centro = (t, font, color, lh) => { lineas(ctx, t, font, CW).forEach(l => { texto(l, font, color, 'center', W / 2, y); y += lh; }); };
    const fila = (izq, der, fi, fd, color, lh) => { texto(izq, fi, color, 'left', P, y); texto(der, fd, color, 'right', W - P, y); y += lh; };
    const sep = () => { y += 6; if (pinta) { ctx.strokeStyle = '#999'; ctx.setLineDash([4, 3]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(P, y + .5); ctx.lineTo(W - P, y + .5); ctx.stroke(); ctx.setLineDash([]); } y += 10; };
    const espaciado = (t, font, gap) => { ctx.font = font; const chars = [...t]; const w = chars.reduce((s, c) => s + ctx.measureText(c).width, 0) + gap * (chars.length - 1); let x = (W - w) / 2; chars.forEach(c => { texto(c, font, '#111', 'left', x, y); x += ctx.measureText(c).width + gap; }); y += 20; };
    if (logo) { const k = Math.min(130 / logo.width, 90 / logo.height, 1); const lw = logo.width * k, lh = logo.height * k; if (pinta) ctx.drawImage(logo, (W - lw) / 2, y, lw, lh); y += lh + 8; }
    centro(n.nombre, `700 24px ${SERIF}`, '#111', 26);
    if (n.telefono) centro('Tel. ' + n.telefono, `400 12.5px ${SANS}`, '#444', 17);
    if (n.redes) centro(n.redes, `400 12.5px ${SANS}`, '#444', 17);
    sep();
    espaciado(cot ? 'COTIZACIÓN' : 'NOTA DE VENTA', `700 13.5px ${SANS}`, 2.5);
    if (d.estado === 'cancelada') { if (pinta) { ctx.strokeStyle = '#a2392e'; ctx.lineWidth = 2; ctx.strokeRect(P, y, CW, 24); } texto('CANCELADA', `700 13px ${SANS}`, '#a2392e', 'center', W / 2, y + 5); y += 32; }
    const sm = `400 12.5px ${SANS}`, smb = `700 12.5px ${SANS}`;
    fila('Folio', folio(d.id), sm, smb, '#333', 18);
    fila('Fecha', fmtFecha(d.fecha || nowISO(), 1), sm, sm, '#333', 18);
    if (cot && d.vigenciaHasta) fila('Válida hasta', fmtFecha(d.vigenciaHasta, 1), sm, sm, '#333', 18);
    if (d.clienteNombre) fila('Cliente', d.clienteNombre, sm, sm, '#333', 18);
    sep();
    d.items.forEach(it => {
      const desc = `${num(it.cantidad)} ${unidadTxt(it.unidad, num(it.cantidad))} · ${it.descripcion}${it.material ? ' ' + it.material : ''}${it.medida ? ' ' + it.medida : ''}`;
      lineas(ctx, desc, `600 13.5px ${SANS}`, CW).forEach(l => { texto(l, `600 13.5px ${SANS}`, '#111', 'left', P, y); y += 18; });
      const det = `${num(it.peso) ? fmtG(it.peso) : ''}${it.modo === 'peso' && it.precioGramo ? ' × ' + fmt$(it.precioGramo) + '/g' : ''}`;
      fila(det, fmt$(it.importe), sm, `700 13px ${SANS}`, '#333', 24);

    if (num(d.descuento)) fila(`Descuento${d.descTipo === '%' && num(d.descValor) ? ' (' + fmtN(d.descValor) + '%)' : ''}`, '−' + fmt$(d.descuento), `400 14px ${SANS}`, `400 14px ${SANS}`, '#111', 20);
    y += 4; fila('TOTAL', fmt$(d.total), `700 19px ${SANS}`, `700 19px ${SANS}`, '#111', 28);
    if (d.notas) { sep(); lineas(ctx, d.notas, sm, CW).forEach(l => { texto(l, sm, '#444', 'left', P, y); y += 17; }); }
    y += 8;

  };

  const c = document.createElement('canvas'); c.width = W * K; c.height = H * K;

  dibujar(ctx, true);
  return c;
}

  const meses = [...new Set(S.ventas.map(v => String(v.fecha).slice(0, 7)).concat(S.cotizaciones.map(c => String(c.fecha).slice(0, 7))))].filter(Boolean).sort().reverse();
  return `<div class="ph"><div><h1>Ventas</h1><p class="mut">Ventas registradas y cotizaciones enviadas.</p></div><button class="btn pri" data-act="ir" data-v="cotizar">${IC.plus} Nueva</button></div>
  <div class="between" style="margin-bottom:14px">
    <div class="seg"><button class="${S.vtab === 'ventas' ? 'on' : ''}" data-act="vtab" data-t="ventas">Ventas</button><button class="${S.vtab === 'cots' ? 'on' : ''}" data-act="vtab" data-t="cots">Cotizaciones</button></div>
    <div class="row" style="flex:1;justify-content:flex-end;max-width:520px"><input type="search" id="v-q" data-inp="vQ" value="${h(S.vq)}" placeholder="Buscar folio, cliente o pieza" style="flex:1;min-width:160px">
    <select data-inp="vMes" style="width:auto"><option value="">Todos los meses</option>${meses.map(m => `<option value="${m}" ${S.vmes === m ? 'selected' : ''}>${MESES_L[+m.slice(5) - 1]} ${m.slice(0, 4)}</option>`).join('')}</select></div>
  </div>
  <div class="panel" id="v-list"></div>`;
};
AFTER.ventas = () => renderVentasList();
function renderVentasList() {
  const box = $('#v-list'); if (!box) return;
  const q = norm(S.vq.trim());
  const match = d => !q || norm([d.id, d.clienteNombre, d.clienteTel, d.items.map(i => i.descripcion + ' ' + i.material).join(' ')].join(' ')).includes(q);
  const mes = d => !S.vmes || String(d.fecha).startsWith(S.vmes);
  if (S.vtab === 'ventas') {
    const vs = S.ventas.filter(v => match(v) && mes(v)).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    const act = vs.filter(v => v.estado !== 'cancelada');
    box.innerHTML = vs.length ? `<div class="between small mut" style="margin-bottom:6px"><span>${act.length} ventas</span><span class="num">Total ${fmt$(act.reduce((s, v) => s + v.total, 0))} · Ganancia ${fmt$(act.reduce((s, v) => s + v.ganancia, 0))}</span></div>${ventaLista(vs)}<p class="xs mut" style="margin:8px 0 0">* Ganancia parcial: alguna pieza no tiene costo registrado.</p>` : `<div class="empty">${IC.ventas}<div>No hay ventas${q || S.vmes ? ' con esos filtros' : ' todavía'}.</div></div>`;
  } else {
    const cs = S.cotizaciones.filter(c => match(c) && mes(c)).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    box.innerHTML = cs.length ? `<div class="list">${cs.map(c => { const e = estadoCot(c); return `<div class="li" data-act="verCot" data-id="${c.id}"><div class="grow"><div class="t">${h(c.clienteNombre || 'Sin nombre')} <span class="pill ${PILL_COT[e]}">${e[0].toUpperCase() + e.slice(1)}</span></div><div class="s">${h(folio(c.id))} · ${fmtFecha(c.fecha, 1)} · ${c.items.length} partidas · ${h(nombreUsuario(c.usuario))}</div></div><div class="rt num"><b>${fmt$(c.total)}</b></div></div>`; }).join('')}</div>` : `<div class="empty">${IC.cotizar}<div>No hay cotizaciones${q || S.vmes ? ' con esos filtros' : ' todavía'}.</div></div>`;
  }
}
function verVenta(id) {

  modal(`<h2>Venta ${h(folio(v.id))} ${v.estado === 'cancelada' ? '<span class="pill bad">Cancelada</span>' : ''}${esPend(v.id) ? ' <span class="pill warn">Sin subir</span>' : ''}</h2>

    <div class="tscroll"><table class="tbl"><thead><tr><th>Pieza</th><th class="r">Cant.</th><th class="r">Peso</th><th class="r">Mercado /g</th><th class="r">%</th><th class="r">Venta /g</th><th class="r">Importe</th><th class="r">Costo</th><th class="r">Ganancia</th></tr></thead><tbody>

      <td class="r num">${it.modo === 'peso' ? fmt$(it.precioMercado) : '—'}</td><td class="r num">${it.modo === 'peso' ? fmtN(it.pct) + '%' : '—'}</td><td class="r num">${it.modo === 'peso' ? fmt$(it.precioGramo) : 'Fijo'}</td>
      <td class="r num">${fmt$(it.importeNeto ?? it.importe)}</td><td class="r num">${it.costo == null ? '—' : fmt$(it.costo)}</td><td class="r num">${it.ganancia == null ? '—' : fmt$(it.ganancia)}</td></tr>`).join('')}

      <div class="kpi"><div class="l">Ganancia</div><div class="v" style="font-size:18px">${fmt$(v.ganancia)}</div>${v.costoIncompleto ? '<div class="s">Parcial</div>' : ''}</div>
    </div>

    <div class="mact">

    </div>`, 'wide');
}
async function cancelarVenta(id) {
  const v = S.ventas.find(x => x.id === id); if (!v) return;
  const conLote = v.items.some(i => i.loteId);
  const r = await preguntar(`¿Cancelar la venta ${h(v.id)}?`, conLote ? 'Se marcará como cancelada. ¿Las piezas regresan al inventario?' : 'Se marcará como cancelada y dejará de contar en los reportes.',
    conLote ? [{label: 'No cancelar', val: null}, {label: 'Cancelar sin regresar', val: 'no', cls: 'danger'}, {label: 'Cancelar y regresar piezas', val: 'si', cls: 'pri'}] : [{label: 'No cancelar', val: null}, {label: 'Cancelar venta', val: 'no', cls: 'danger'}]);
  if (!r) return;
  modal(`<div class="empty"><span class="spin" style="color:var(--gold);width:28px;height:28px"></span><div style="margin-top:10px">Cancelando…</div></div>`, 'narrow');
  try {
    const x = await api('cancelarVenta', {id, devolver: r === 'si'});
    upsert(S.ventas, nVenta(x.venta)); (x.lotes || []).forEach(l => upsert(S.lotes, nLote(l)));
    cerrarModal(); render(); toast(r === 'si' ? 'Venta cancelada y piezas devueltas' : 'Venta cancelada');
  } catch (e) { cerrarModal(); toast(e.message, 'err'); }
}
function verCot(id) {
  const c = S.cotizaciones.find(x => x.id === id); if (!c) return;
  const e = estadoCot(c);
  modal(`<h2>Cotización ${h(c.id)} <span class="pill ${PILL_COT[e]}">${e[0].toUpperCase() + e.slice(1)}</span></h2>
    <p class="mut" style="margin:0 0 14px">${fmtFecha(c.fecha, 1)} · ${h(c.clienteNombre || 'Sin nombre')}${c.clienteTel ? ' · ' + h(c.clienteTel) : ''} · vence ${fmtFecha(c.vigenciaHasta, 1)}</p>
    <div class="tscroll"><table class="tbl"><thead><tr><th>Pieza</th><th class="r">Cant.</th><th class="r">Peso</th><th class="r">Precio</th><th class="r">Importe</th></tr></thead><tbody>
    ${c.items.map(it => `<tr><td><b>${h(it.descripcion)}</b> <span class="mut">${h(it.material || '')}</span></td><td class="r">${it.cantidad}</td><td class="r num">${num(it.peso) ? fmtG(it.peso) : '—'}</td><td class="r num">${it.modo === 'peso' ? fmt$(it.precioGramo) + '/g' : fmt$(it.precioDirecto) + ' c/u'}</td><td class="r num">${fmt$(it.importe)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="tot-row big" style="margin-top:8px"><span>Total</span><span class="num">${fmt$(c.total)}</span></div>
    <div class="mact">
      ${['pendiente', 'vencida'].includes(e) && !esPend(c.id) ? `<button class="btn danger" data-act="cancelarCot" data-id="${c.id}">Cancelar</button>` : ''}
      <button class="btn" data-act="ticketCotId" data-id="${c.id}">${IC.share} Ticket</button>
      ${c.estado === 'vendida' ? `<button class="btn pri" data-act="verVenta" data-id="${h(c.ventaId)}">Ver venta ${h(c.ventaId)}</button>` : ''}
      ${['pendiente', 'vencida'].includes(e) ? `<button class="btn pri" data-act="abrirCot" data-id="${c.id}">${IC.edit} Abrir para editar o vender</button>` : ''}
    </div>`, 'wide');
}

/* ---------- Clientes ---------- */
V.clientes = () => `<div class="ph"><div><h1>Clientes frecuentes</h1><p class="mut">${S.clientes.length} clientes guardados</p></div><button class="btn pri" data-act="formCliente">${IC.plus} Agregar cliente</button></div>

AFTER.clientes = () => renderClientes();
function statsCliente(c) {
  const vs = ventasActivas().filter(v => v.clienteId === c.id || (c.telefono && telWa(v.clienteTel) === telWa(c.telefono)));
  return {n: vs.length, total: vs.reduce((s, v) => s + v.total, 0), ultima: vs.map(v => v.fecha).sort().pop()};
}
function renderClientes() {
  const q = norm(S.cq.trim()), box = $('#c-list'); if (!box) return;
  const cs = S.clientes.filter(c => !q || norm(c.nombre + ' ' + c.telefono).includes(q)).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  box.innerHTML = cs.length ? `<div class="list">${cs.map(c => { const s = statsCliente(c); return `<div class="li" data-act="verCliente" data-id="${c.id}"><div class="thumb xs" style="font-weight:600;color:var(--gold-ink)">${h((c.nombre || '?').trim().charAt(0).toUpperCase())}</div><div class="grow"><div class="t">${h(c.nombre)}</div><div class="s">${h(c.telefono || 'Sin teléfono')}${s.ultima ? ' · última compra ' + fmtFecha(s.ultima) : ''}</div></div><div class="rt"><div class="num"><b>${fmt$(s.total)}</b></div><div class="xs mut">${s.n} compras</div></div></div>`; }).join('')}</div>`
    : `<div class="empty">${IC.clientes}<div>${q ? 'Nadie coincide con esa búsqueda.' : 'Aún no hay clientes. Se agregan aquí o al cotizar marcando “Guardar como cliente frecuente”.'}</div></div>`;

function verCliente(id) {

  modal(`<h2>${h(c.nombre)}</h2><p class="mut" style="margin:0 0 12px">${h(c.telefono || 'Sin teléfono')}${c.notas ? ' · ' + h(c.notas) : ''}</p>
    <h3 style="margin-bottom:4px">Compras</h3>${ventaLista(vs.slice(0, 10))}
    <div class="mact"><button class="btn danger" data-act="eliminarCliente" data-id="${c.id}">${IC.trash}</button>${c.telefono ? `<a class="btn" target="_blank" href="${HTTPS}wa.me/${telWa(c.telefono)}">${IC.wa} WhatsApp</a>` : ''}<button class="btn" data-act="formCliente" data-id="${c.id}">${IC.edit} Editar</button><button class="btn pri" data-act="cotizarCliente" data-id="${c.id}">${IC.cotizar} Cotizar</button></div>`);
}
function formCliente(id) {

/* ---------- Reportes ---------- */
function mesesHasta(ym, n) { const [y, m] = ym.split('-').map(Number); const out = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(y, m - 1 - i, 1); out.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); } return out; }
function datosReporte() {
  const mes = S.repMes, va = ventasActivas();
  const vm = va.filter(v => String(v.fecha).startsWith(mes));
  const act = S.lotes.filter(l => l.activo && l.disponible > 0);
  const porMat = {}, porTipo = {};
  act.forEach(l => { if (l.costoUnit != null) porMat[l.material] = (porMat[l.material] || 0) + l.costoUnit * l.disponible; porTipo[l.tipo] = (porTipo[l.tipo] || 0) + l.disponible; });
  const top = {};
  vm.forEach(v => v.items.forEach(it => { const k = `${it.descripcion} ${it.material || ''}`.trim(); const t = top[k] || (top[k] = {k, n: 0, imp: 0, gan: 0}); t.n += num(it.cantidad); t.imp += num(it.importeNeto ?? it.importe); t.gan += num(it.ganancia); }));
  const porUsr = {};
  vm.forEach(v => { const k = nombreUsuario(v.usuario) || '—'; const t = porUsr[k] || (porUsr[k] = {k, n: 0, total: 0}); t.n++; t.total += v.total; });
  const meses = mesesHasta(mes, 12);
  const serie = meses.map(m => { const x = va.filter(v => String(v.fecha).startsWith(m)); return {m, total: x.reduce((s, v) => s + v.total, 0), gan: x.reduce((s, v) => s + v.ganancia, 0)}; });
  return {mes, vm, act, porMat, porTipo, top: Object.values(top).sort((a, b) => b.imp - a.imp).slice(0, 10), porUsr: Object.values(porUsr), serie,
    valorInv: Object.values(porMat).reduce((s, x) => s + x, 0), piezas: act.reduce((s, l) => s + l.disponible, 0), sinCosto: act.filter(l => l.costoUnit == null).length,
    ventasMes: vm.reduce((s, v) => s + v.total, 0), ganMes: vm.reduce((s, v) => s + v.ganancia, 0), costoMes: vm.reduce((s, v) => s + v.costoTotal, 0)};
}
V.reportes = () => {
  const R = datosReporte();
  const [y, m] = R.mes.split('-');
  return `<div class="ph"><div><h1>Reportes</h1><p class="mut">${MESES_L[+m - 1][0].toUpperCase() + MESES_L[+m - 1].slice(1)} ${y}</p></div>
    <div class="row"><input type="month" data-inp="repMes" value="${R.mes}" style="width:auto"><button class="btn pri" data-act="pdf">${IC.dl} Descargar PDF</button></div></div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi"><div class="l">Ventas del mes</div><div class="v">${fmt$(R.ventasMes)}</div><div class="s">${R.vm.length} ventas · ticket prom. ${fmt$(R.vm.length ? R.ventasMes / R.vm.length : 0)}</div></div>
    <div class="kpi"><div class="l">Ganancia del mes</div><div class="v">${fmt$(R.ganMes)}</div><div class="s">${R.ventasMes ? fmtN(R.ganMes / R.ventasMes * 100) + '% de lo vendido' : '—'}</div></div>
    <div class="kpi"><div class="l">Inventario a costo (hoy)</div><div class="v">${fmt$(R.valorInv)}</div><div class="s">${R.sinCosto ? R.sinCosto + ' lotes sin costo' : 'todos con costo'}</div></div>
    <div class="kpi"><div class="l">Piezas disponibles</div><div class="v">${fmtN(R.piezas)}</div><div class="s">${R.act.length} lotes</div></div>
  </div>
  <div class="panel"><h2>Ventas y ganancia, últimos 12 meses</h2><div class="chartbox"><canvas id="ch1"></canvas></div></div>
  <div class="grid g2 st" style="margin-top:16px">
    <div class="panel" style="margin:0"><h2>Inventario por material (a costo)</h2><div class="chartbox"><canvas id="ch2"></canvas></div></div>
    <div class="panel" style="margin:0"><h2>Piezas disponibles por tipo</h2><div class="chartbox"><canvas id="ch3"></canvas></div></div>
  </div>
  <div class="grid g2 st" style="margin-top:16px">
    <div class="panel" style="margin:0"><h2>Lo más vendido del mes</h2>${R.top.length ? `<div class="tscroll"><table class="tbl"><thead><tr><th>Pieza</th><th class="r">Cant.</th><th class="r">Vendido</th><th class="r">Ganancia</th></tr></thead><tbody>${R.top.map(t => `<tr><td>${h(t.k)}</td><td class="r">${t.n}</td><td class="r num">${fmt$(t.imp)}</td><td class="r num">${fmt$(t.gan)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="mut small">Sin ventas este mes.</p>'}</div>
    <div class="panel" style="margin:0"><h2>Ventas por persona</h2>${R.porUsr.length ? `<table class="tbl"><thead><tr><th>Atendió</th><th class="r">Ventas</th><th class="r">Total</th></tr></thead><tbody>${R.porUsr.map(t => `<tr><td>${h(t.k)}</td><td class="r">${t.n}</td><td class="r num">${fmt$(t.total)}</td></tr>`).join('')}</tbody></table>` : '<p class="mut small">Sin ventas este mes.</p>'}</div>
  </div>`;
};
const PAL = ['#a87a24', '#3b332c', '#8f9aa5', '#b86b55', '#6f8456', '#c9a55a', '#5d6f86', '#9c7aa0'];
AFTER.reportes = () => {
  if (typeof Chart === 'undefined') { $$('.chartbox').forEach(b => b.innerHTML = '<p class="mut small">No se pudieron cargar las gráficas. Revisa tu conexión.</p>'); return; }
  const R = datosReporte();
  Chart.defaults.font.family = 'Inter, system-ui, sans-serif'; Chart.defaults.color = '#6e6359';
  const money = v => '$' + Number(v).toLocaleString('es-MX', {maximumFractionDigits: 0});
  S.charts.push(new Chart($('#ch1'), {type: 'bar', data: {labels: R.serie.map(s => mesLabel(s.m)), datasets: [
    {label: 'Ventas', data: R.serie.map(s => r2(s.total)), backgroundColor: '#a87a24', borderRadius: 4, maxBarThickness: 28},
    {label: 'Ganancia', data: R.serie.map(s => r2(s.gan)), backgroundColor: '#3b332c', borderRadius: 4, maxBarThickness: 28}]},
    options: {maintainAspectRatio: false, animation: false, plugins: {legend: {position: 'bottom'}, tooltip: {callbacks: {label: c => `${c.dataset.label}: ${fmt$(c.raw)}`}}}, scales: {y: {ticks: {callback: money}, grid: {color: '#efe8dc'}}, x: {grid: {display: false}}}}}));
  const pm = Object.entries(R.porMat).sort((a, b) => b[1] - a[1]);
  S.charts.push(new Chart($('#ch2'), {type: 'doughnut', data: {labels: pm.map(x => x[0]), datasets: [{data: pm.map(x => r2(x[1])), backgroundColor: PAL, borderColor: '#fffdf9', borderWidth: 2}]},
    options: {maintainAspectRatio: false, animation: false, cutout: '58%', plugins: {legend: {position: 'bottom'}, tooltip: {callbacks: {label: c => `${c.label}: ${fmt$(c.raw)}`}}}}}));
  const pt = Object.entries(R.porTipo).sort((a, b) => b[1] - a[1]);

async function descargarPDF() {
  if (!window.jspdf) throw new Error('No cargó la herramienta de PDF. Revisa tu conexión.');
  const R = datosReporte(), n = cfg('negocio');
  const {jsPDF} = window.jspdf; const doc = new jsPDF({unit: 'mm', format: 'a4'});
  const W = 210, M = 15; let y = 18;
  const [yy, mm] = R.mes.split('-');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.text(n.nombre, M, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(110); doc.text(`Reporte de ${MESES_L[+mm - 1]} ${yy} · generado ${fmtFecha(nowISO(), 1)}`, M, y += 7);
  doc.setTextColor(30); y += 8;
  const kp = [['Ventas del mes', fmt$(R.ventasMes)], ['Ganancia del mes', fmt$(R.ganMes)], ['Número de ventas', String(R.vm.length)], ['Costo de lo vendido', fmt$(R.costoMes)], ['Inventario a costo (hoy)', fmt$(R.valorInv)], ['Piezas disponibles', fmtN(R.piezas)]];
  kp.forEach((k, i) => { const x = M + (i % 3) * 61, yy2 = y + Math.floor(i / 3) * 16; doc.setDrawColor(225); doc.roundedRect(x, yy2 - 5, 57, 13, 2, 2); doc.setFontSize(8.5); doc.setTextColor(110); doc.text(k[0], x + 3, yy2); doc.setFontSize(11.5); doc.setTextColor(30); doc.setFont('helvetica', 'bold'); doc.text(k[1], x + 3, yy2 + 5.5); doc.setFont('helvetica', 'normal'); });
  y += 36;
  const img = (id, w, hh) => { const c = $(id); if (!c) return; if (y + hh > 280) { doc.addPage(); y = 18; } doc.addImage(c.toDataURL('image/png', 1), 'PNG', M, y, w, hh); y += hh + 6; };
  const titulo2 = t => { if (y > 265) { doc.addPage(); y = 18; } doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(t, M, y); doc.setFont('helvetica', 'normal'); y += 5; };
  titulo2('Ventas y ganancia, últimos 12 meses'); img('#ch1', W - 2 * M, 70);
  titulo2('Inventario por material (a costo)'); img('#ch2', 120, 62);
  titulo2('Piezas disponibles por tipo'); img('#ch3', W - 2 * M, 62);
  const tabla = (t, cols, filas) => {
    titulo2(t); doc.setFontSize(9.5);
    const xs = cols.map(c => c[1]);
    const enc = () => { doc.setTextColor(110); cols.forEach((c, i) => doc.text(c[0], xs[i], y, {align: c[2] || 'left'})); doc.setTextColor(30); y += 2; doc.setDrawColor(220); doc.line(M, y, W - M, y); y += 5; };
    enc();
    if (!filas.length) { doc.text('Sin datos', M, y); y += 6; }
    filas.forEach(f => { if (y > 282) { doc.addPage(); y = 18; enc(); } f.forEach((v, i) => doc.text(String(v).slice(0, 48), xs[i], y, {align: cols[i][2] || 'left'})); y += 5.5; });
    y += 4;
  };
  tabla('Lo más vendido del mes', [['Pieza', M], ['Cant.', 120, 'right'], ['Vendido', 155, 'right'], ['Ganancia', W - M, 'right']], R.top.map(t => [t.k, t.n, fmt$(t.imp), fmt$(t.gan)]));
  tabla('Ventas del mes', [['Folio', M], ['Fecha', 38], ['Cliente', 66], ['Total', 155, 'right'], ['Ganancia', W - M, 'right']], R.vm.slice().sort((a, b) => String(a.fecha).localeCompare(String(b.fecha))).map(v => [v.id, fmtFecha(v.fecha), v.clienteNombre || 'Mostrador', fmt$(v.total), fmt$(v.ganancia) + (v.costoIncompleto ? '*' : '')]));
  const inv = Object.entries(R.porMat).sort((a, b) => b[1] - a[1]);
  tabla('Inventario por material', [['Material', M], ['Valor a costo', W - M, 'right']], inv.map(x => [x[0], fmt$(x[1])]));
  doc.save(`Reporte ${n.nombre} ${R.mes}.pdf`);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!e.target.closest('.ac')) cerrarAc();
  if (e.target.id === 'modal-bg') return cerrarModal();
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act];
  if (f) { e.preventDefault(); Promise.resolve(f(b, e)).catch(err => toast(err.message || String(err), 'err')); }
});
document.addEventListener('input', e => { const t = e.target.closest('[data-inp]'); if (!t || t.type === 'file') return; const f = INP[t.dataset.inp]; if (f) f(t, e); });
document.addEventListener('change', e => { const t = e.target; if (t.type === 'file' && t.dataset.inp && INP[t.dataset.inp]) INP[t.dataset.inp](t, e); });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape' && $('#visor.open')) return $('#visor').classList.remove('open');
  if (e.key === 'Escape') { if ($('.ac-list.open')) return cerrarAc(); if ($('#modal-bg.open')) return cerrarModal(); }
  if (t.dataset && t.dataset.kbd === 'pinEnter' && e.key === 'Enter') { e.preventDefault(); const b = document.querySelector(`[data-act="${t.dataset.go}"]`); if (b) b.click(); return; }
  if (t.dataset && t.dataset.kbd === 'lista' && e.key === 'Enter') { e.preventDefault(); ACT.listaAgregar({dataset: {k: t.dataset.k}}); return; }
  if (!t.dataset || !['add', 'cli'].includes(t.dataset.kbd)) return;
  const box = t.closest('.ac').querySelector('.ac-list'); if (!box.classList.contains('open')) return;
  const its = $$('.aci', box); let i = its.findIndex(x => x.classList.contains('act'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); i = (i + (e.key === 'ArrowDown' ? 1 : -1) + its.length) % its.length; its.forEach((x, j) => x.classList.toggle('act', j === i)); its[i].scrollIntoView({block: 'nearest'}); }
  else if (e.key === 'Enter') { e.preventDefault(); if (its[i]) its[i].click(); }
});
document.addEventListener('focusin', e => { if (e.target.id === 'add-q' && e.target.value.trim()) renderAddAc(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.cargado && Date.now() - (S.cargaT || 0) > 60000 && !$('#modal-bg.open')) cargar(true); });

// Copia de lo último que se vio, para poder abrir la app sin señal
let _snapT = null;
function guardarSnap() {
  if (S.demo || !S.cargado || !S.usuario) return;
  clearTimeout(_snapT);
  _snapT = setTimeout(() => {
    const limpio = (arr, quita) => arr.map(x => { const o = {...x}; quita.forEach(k => delete o[k]); return o; });
    KV.set('snap', {v: 1, t: nowISO(), usuario: S.usuario, yo: S.yo, usuarios: S.usuarios, config: S.config, urls: S.urls,
      lotes: limpio(S.lotes, ['ubic', 'fotosArr']), clientes: S.clientes, cotizaciones: limpio(S.cotizaciones, ['items']), ventas: limpio(S.ventas, ['items'])});
  }, 800);
}
async function aplicarSnap() {
  const d = await KV.get('snap');
  if (!d || d.usuario !== Acceso.activa) return false;
  S.lotes = d.lotes.map(nLote); S.clientes = d.clientes.map(nCli); S.cotizaciones = d.cotizaciones.map(nCot); S.ventas = d.ventas.map(nVenta);
  S.config = d.config || {}; S.usuario = d.usuario; S.urls = d.urls || {}; S.yo = d.yo || {}; S.usuarios = d.usuarios || [];
  S.thumbs = (await KV.get('thumbs')) || {};
  S.cargado = true; S.cargaT = Date.now(); S.desdeSnap = d.t;
  if (!S.cot) S.cot = Object.assign(nuevaCot(), ls.get('ahj_cot', {}) || {});
  if (!Array.isArray(S.cot.items)) S.cot.items = [];
  $('#loading').style.display = 'none';
  marcarRed(true); render(); renderRed();
  toast(`Sin conexión: mostrando lo guardado el ${fmtFecha(d.t, 1)}`);
  return true;
}

// Miniaturas: se guardan en el dispositivo y solo se descargan las nuevas
async function actualizarMiniaturas() {
  if (!S.demo && !Object.keys(S.thumbs).length) S.thumbs = (await KV.get('thumbs')) || {};
  try {
    const r = await api('miniaturas', {tengo: Object.keys(S.thumbs)});
    const ids = new Set(r.ids || []);
    Object.keys(S.thumbs).forEach(k => { if (!ids.has(k)) delete S.thumbs[k]; });
    Object.assign(S.thumbs, r.nuevas || {});
    if (!S.demo) KV.set('thumbs', S.thumbs);
  } catch (e) { /* sin conexión: se quedan las guardadas */ }
  if (['inventario', 'avisos', 'inicio'].includes(S.view) && !$('#modal-bg.open')) render(); else if (S.view === 'cotizar') renderCotItems();
}

/* ═════════════════════════ Carga ═════════════════════════ */
function conLimite(p, ms, msg) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => { const e = new Error(msg); e.red = true; rej(e); }, ms))]);
}
async function cargar(silencio) {
  if (silencio && (Cola.items.length || sincronizando)) return;
  if (!Acceso.token()) { if (!silencio) mostrarAcceso(); return; }
  const aviso = silencio ? null : setTimeout(() => { const l = $('#loading'); if (l && l.style.display !== 'none' && !$('#load-hint')) l.insertAdjacentHTML('beforeend', '<p id="load-hint" class="mut small">Está tardando más de lo normal…</p>'); }, 12000);
  try {
    const d = await conLimite(api('cargar'), 40000, 'La app no recibió respuesta de Google en 40 segundos.');
    clearTimeout(aviso);
    S.lotes = (d.lotes || []).map(nLote); S.clientes = (d.clientes || []).map(nCli);
    S.cotizaciones = (d.cotizaciones || []).map(nCot); S.ventas = (d.ventas || []).map(nVenta);
    S.config = d.config || {}; S.usuario = d.usuario || ''; S.urls = d.urls || {}; S.demo = !!d.demo || MODO === 'demo';
    S.yo = d.yo || {}; S.usuarios = d.usuarios || [];
    S.cargado = true; S.cargaT = Date.now(); S.desdeSnap = null;
    if (!S.cot) S.cot = Object.assign(nuevaCot(), ls.get('ahj_cot', {}) || {});
    if (!Array.isArray(S.cot.items)) S.cot.items = [];
    $('#loading').style.display = 'none';
    if (!(S.view === 'cotizar' && silencio)) render(); else { renderNav(); renderPrecios(); }
    renderRed();
